<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Winston — Activity Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Cambo&family=Lato:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono&display=swap" rel="stylesheet">
<style>
:root {
    font-synthesis: none;
    --teal: #174445;
    --teal-rgb: 23,68,69;
    --green: #0d8f64;
    --green-rgb: 13,143,100;
    --warm: #e9e7e3;
    --warm-rgb: 233,231,227;
    --ink: #0b2021;
    --ink-2: #0e2628;
    --teal-lift: #2a7f80;
    --green-lift: #4cc296;
    --heading-ink: #0e2929;
    --font-heading: 'Cambo', Georgia, 'Times New Roman', serif;
    --font-body: 'Lato', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --font-mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: var(--font-body);
    background: var(--warm);
    color: #000;
    line-height: 1.7;
    min-height: 100vh;
}

/* ── Header ─────────────────────────────── */
header {
    background: linear-gradient(180deg, #0d2d2e 0%, #123a3b 50%, #0d2d2e 100%);
    padding: 48px 32px 40px;
    text-align: center;
}

header h1 {
    font-family: var(--font-heading);
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    color: #fff;
    font-weight: 400;
    line-height: 1.15;
    margin-bottom: 8px;
}

header .subtitle {
    color: rgba(233,231,227,0.78);
    font-size: 0.95rem;
}

header .generated {
    color: rgba(233,231,227,0.5);
    font-size: 0.72rem;
    margin-top: 12px;
    font-family: var(--font-mono);
}

/* ── Stats bar ──────────────────────────── */
.stats-bar {
    display: flex;
    gap: 16px;
    justify-content: center;
    padding: 24px 32px;
    max-width: 900px;
    margin: -28px auto 0;
    position: relative;
    z-index: 1;
}

.stat-card {
    background: #fff;
    border-radius: 12px;
    padding: 20px 28px;
    text-align: center;
    flex: 1;
    max-width: 200px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    border: 1px solid rgba(0,0,0,0.06);
}

.stat-card .count {
    font-family: var(--font-heading);
    font-size: 2.4rem;
    line-height: 1;
    margin-bottom: 4px;
}

.stat-card .label {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #666;
}

.stat-card.autonomous .count { color: var(--green); }
.stat-card.recommendation .count { color: #c4820e; }
.stat-card.owner-only .count { color: #b33; }

/* ── Filters ────────────────────────────── */
.filters {
    display: flex;
    gap: 8px;
    justify-content: center;
    padding: 0 32px 24px;
    flex-wrap: wrap;
}

.filter-btn {
    font-family: var(--font-body);
    font-size: 0.82rem;
    font-weight: 700;
    padding: 8px 20px;
    border-radius: 100px;
    border: 1.5px solid rgba(0,0,0,0.12);
    background: #fff;
    cursor: pointer;
    transition: all 0.15s ease;
    color: #444;
}

.filter-btn:hover {
    border-color: rgba(0,0,0,0.25);
    color: #000;
}

.filter-btn.active {
    background: var(--teal);
    border-color: var(--teal);
    color: #fff;
}

.filter-btn.active.autonomous { background: var(--green); border-color: var(--green); }
.filter-btn.active.recommendation { background: #c4820e; border-color: #c4820e; }
.filter-btn.active.owner-only { background: #b33; border-color: #b33; }

/* Flat authority dots for filter buttons (no emoji) */
.filter-dot {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: middle;
    position: relative;
    top: -1px;
}
.filter-dot.autonomous { background: var(--green); }
.filter-dot.recommendation { background: #c4820e; }
.filter-dot.owner-only { background: #b33; }

/* ── Timeline ───────────────────────────── */
.timeline {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 32px 64px;
}

.timeline-empty {
    text-align: center;
    padding: 64px 32px;
    color: #999;
    font-style: italic;
}

.activity-row {
    display: flex;
    gap: 16px;
    align-items: flex-start;
    padding: 16px 0;
    border-bottom: 1px solid rgba(0,0,0,0.05);
    transition: opacity 0.2s ease;
}

.activity-row.hidden {
    display: none;
}

.activity-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    margin-top: 6px;
    flex-shrink: 0;
}

.activity-dot.autonomous { background: var(--green); }
.activity-dot.recommendation { background: #c4820e; }
.activity-dot.owner-only { background: #b33; }

.activity-body {
    flex: 1;
    min-width: 0;
}

.activity-meta {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-bottom: 2px;
    flex-wrap: wrap;
}

.activity-time {
    font-family: var(--font-mono);
    font-size: 0.78rem;
    color: #888;
}

.activity-category {
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 2px 10px;
    border-radius: 100px;
    background: rgba(23,68,69,0.08);
    color: var(--teal);
}

.activity-action {
    font-size: 0.95rem;
    color: #222;
    line-height: 1.5;
}

/* ── Responsive ─────────────────────────── */
@media (max-width: 640px) {
    header { padding: 36px 20px 32px; }
    .stats-bar { flex-direction: column; align-items: center; margin-top: -20px; padding: 20px; }
    .stat-card { max-width: 100%; width: 100%; }
    .timeline { padding: 0 16px 48px; }
    .filters { padding: 0 16px 20px; }
}
</style>
</head>
<body>

<header>

    <div class="stat-card owner-only">

<div class="filters">
    <button class="filter-btn active" onclick="filterActivities('all', this)">All</button>
    <button class="filter-btn" onclick="filterActivities('autonomous', this)"><span class="filter-dot autonomous"></span>Autonomous</button>
    <button class="filter-btn" onclick="filterActivities('recommendation', this)"><span class="filter-dot recommendation"></span>Recommended</button>

function renderActivities(filter) {
    const container = document.getElementById('timeline');
    const filtered = filter === 'all' 
        ? activities 
        : activities.filter(a => a.level === filter);
    
    if (filtered.length === 0) {
        container.innerHTML = '<div class="timeline-empty">No activities to show for this filter.</div>';
        return;
    }
    
    container.innerHTML = filtered.map(a => `
        <div class="activity-row" data-level="${a.level}">
            <div class="activity-dot ${a.level}"></div>
            <div class="activity-body">
                <div class="activity-meta">
                    <span class="activity-time">${a.timestamp}</span>
                    <span class="activity-category">${a.category}</span>
                </div>
                <div class="activity-action">${a.action}</div>
            </div>
        </div>
    `).join('');
}

function filterActivities(level, btn) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderActivities(level);
}

// Initial render
renderActivities('all');

// Auto-refresh every 5 minutes
setTimeout(() => location.reload(), 300000);
</script>
